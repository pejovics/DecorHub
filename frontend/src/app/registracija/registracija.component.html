<form #registrationForm="ngForm" (ngSubmit)="register(registrationForm)" class="registration-form">
  <div class="form-group">
    <label for="username">Korisničko ime:</label>
    <input type="text" id="username" name="username" [(ngModel)]="user.username" required>
  </div>
  <div class="form-group">
    <label for="password">Lozinka:</label>
    <input type="password" id="password" name="password" [(ngModel)]="user.password" required>
  </div>
  <div class="form-group">
    <label for="type">Tip:</label>
    <select id="type" name="type" [(ngModel)]="user.type" required>
      <option value="kupac">Kupac</option>
      <option value="ponudjac">Ponuđač</option>
    </select>
  </div>
  <div class="form-group">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" [(ngModel)]="user.email" required>
  </div>
  <div class="form-group">
    <label for="phone">Telefon:</label>
    <input type="tel" id="phone" name="phone" [(ngModel)]="user.phone" required>
  </div>
  <div class="form-group">
    <label for="image">Slika profila:</label>
    <input type="file" id="image" name="image" accept="image/*" (change)="onImageSelected($event)">
  </div>
  <div *ngIf="user.type === 'ponudjac'" class="form-group">
    <label for="company">Preduzeće:</label>
    <input type="text" id="company" name="company" [(ngModel)]="user.company">
  </div>
  <button type="submit" [disabled]="registrationForm.invalid" class="btn">Registruj se</button>
</form>
